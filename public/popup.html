<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --secondary: #64748b;
            --accent: #facc15;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            width: 340px;
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-dim);
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .workflow-group {
            margin-bottom: 20px;
        }

        .workflow-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .workflow-item:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .wf-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .wf-name {
            font-size: 14px;
            font-weight: 600;
            flex: 1;
            margin-right: 10px;
        }

        .wf-meta {
            font-size: 11px;
            color: var(--text-dim);
        }

        .wf-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary);
        }

        .icon-btn.play:hover {
            background: var(--success);
        }

        .icon-btn.delete:hover {
            background: var(--danger);
        }

        .empty-state {
            padding: 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .main-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.secondary-btn {
            background: var(--card-bg);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 12px;
        }

        #preview-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
        }

        .step-item {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
        }

        .step-num {
            color: var(--accent);
            font-weight: 800;
            font-size: 14px;
        }

        .step-msg {
            font-size: 13px;
        }

        .step-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .footer-tools {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tool-link {
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: none;
            cursor: pointer;
        }

        .tool-link:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon128.png" alt="Logo">
        <div>
            <div class="title">ClearGuide AI</div>
            <div class="subtitle">복잡한 세상을 쉽고 간결하게.</div>
        </div>
    </div>

    <!-- 현재 페이지 섹션 -->
    <div id="current-section">
        <div class="section-title">📍 현재 페이지 가이드</div>
        <div id="current-list" class="workflow-group">
            <!-- 동적 생성 -->
        </div>
    </div>

    <!-- 기타 워크플로우 섹션 -->
    <div id="other-section">
        <div class="section-title">📦 시나리오 보관함</div>
        <div id="other-list" class="workflow-group">
            <div class="empty-state">불러오는 중...</div>
        </div>
    </div>

    <div class="main-actions">
        <button id="start-pickup" class="primary-btn">
            <span>✨</span> 새 가이드 만들기
        </button>
        <button id="import-btn" class="secondary-btn">가져오기</button>
    </div>

    <div class="footer-tools">
        <div id="export-all" class="tool-link">전체 백업</div>
        <div id="clear-all" class="tool-link">초기화</div>
    </div>

    <!-- 미리보기 패널 -->
    <div id="preview-panel">
        <div class="preview-header">
            <div id="preview-title" style="font-size: 18px; font-weight: bold;">시나리오 미리보기</div>
            <button id="close-preview" class="icon-btn">✕</button>
        </div>
        <div id="preview-meta" style="font-size: 12px; color: var(--text-dim); margin-bottom: 20px;"></div>
        <div id="preview-list" class="preview-content">
            <!-- 동적 생성 -->
        </div>
        <div style="margin-top: 20px;">
            <button id="preview-play" class="primary-btn" style="width: 100%;">이 가이드 바로 실행</button>
        </div>
    </div>

    <input type="file" id="import-file" style="display: none;" accept=".json">
    <script src="popup.js"></script>
</body>

</html>
