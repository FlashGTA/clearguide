<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공공서비스 데모 시작</title></head>
<body>
  <main>
    <p class="eyebrow">ClearGuide public-service demo</p>
    <h1>공공 생활지원 서비스</h1>
    <p id="selected-description">복잡한 신청 절차를 단계별로 안내하는 테스트 화면입니다.</p>
    <div id="selected-service" style="margin:18px 0;padding:14px;border:1px solid #bfdbfe;border-radius:12px;background:#eff6ff"></div>
    <label for="goal-input">무엇을 하시려나요?</label>
    <input id="goal-input" value="생활지원 서비스 신청 안내" aria-describedby="goal-help">
    <small id="goal-help">ClearGuide가 등록된 업무 여정을 찾아 안내를 시작합니다.</small>
    <button id="find-task">AI 안내 여정 찾기</button>
    <button id="start-task">서비스 이용 시작</button>
  </main>
  <script src="../../sdk/clearguide-goal-router.js"></script>
  <script src="../../sdk/clearguide-player.js"></script>
  <script src="../workflow.js"></script>
  <script>
    const serviceId = new URLSearchParams(location.search).get('service') || 'bokjiro-support';
    const selectedService = window.CLEARGUIDE_SERVICE_CATALOG.find(item => item.id === serviceId) || window.CLEARGUIDE_SERVICE_CATALOG[1];
    document.title = `ClearGuide · ${selectedService.title}`;
    document.querySelector('#selected-service').innerHTML = `<strong>${selectedService.portal}</strong> · ${selectedService.title}<br><small>안내할 단계: ${selectedService.steps.join(' → ')}</small>`;
    document.querySelector('#selected-description').textContent = selectedService.description;
    const player = new ClearGuidePlayer();
    player.init({ showDashboard: true, accentColor: '#2563eb' });
    const router = new ClearGuideGoalRouter([window.CLEARGUIDE_DEMO_WORKFLOW]);
    document.querySelector('#find-task').addEventListener('click', async () => {
      const result = await router.resolve(document.querySelector('#goal-input').value);
      if (!result.workflowId) {
        alert(result.reason);
        return;
      }
      const confirmed = confirm(`“${window.CLEARGUIDE_DEMO_WORKFLOW.name}” 안내를 시작할까요?\n\n${result.reason}`);
      if (confirmed) player.play(window.CLEARGUIDE_DEMO_WORKFLOW);
    });
    document.querySelector('#start-task').addEventListener('click', () => {
      player.play(window.CLEARGUIDE_DEMO_WORKFLOW);
    });
  </script>
</body>
</html>
